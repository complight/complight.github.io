name: ci 
on:
  push:
    branches: 
      - master
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: presentations/gaussian_steganography/package-lock.json
      - name: Install Slidev dependencies
        working-directory: presentations/gaussian_steganography
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: Build Gaussian steganography slides
        working-directory: presentations/gaussian_steganography
        run: npm run build
      - run: pip install mkdocs-material 
      - run: pip install mkdocs-glightbox
      - run: pip install mkdocs-bibtex
      - run: pip install mkdocs-redirects
      - run: pip install mkdocstrings
      - run: pip install --upgrade setuptools
      - run: mkdocs gh-deploy --force

